apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-portal-view
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-portal-view
  template:
    metadata:
      labels:
        app: api-portal-view
    spec:
      containers:
        - name: api-portal-view
          image: quay.bancofiedesa.com.bo/openshift_laboratorio/api-portal-view:latest
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: api-portal-view-service
spec:
  selector:
    app: api-portal-view
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: api-portal-view-route
spec:
  to:
    kind: Service
    name: api-portal-view-service
  port:
    targetPort: 3000
